<!DOCTYPE html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stranica nije pronađena — Meni je pomoglo redizajn</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F2F1EC">
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:#F2F1EC;color:#17171A;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}a{color:#17171A}a:hover{color:#1F4BFF}</style>
</head>
<body>
<main style="max-width:560px;padding:40px 22px">
<div style="font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#6B6A66">Greška 404</div>
<h1 style="margin:14px 0 0;font-size:clamp(32px,6vw,48px);line-height:1.05;letter-spacing:-.03em;font-weight:600">Ova stranica ne postoji.</h1>
<p style="margin:14px 0 0;font-size:17px;line-height:1.55;color:#55544F">Link je možda pogrešno prepisan ili je stranica premeštena.</p>
<a id="home" href="./" style="display:inline-flex;margin-top:26px;padding:14px 22px;border-radius:999px;background:#17171A;color:#F2F1EC;font-weight:600;text-decoration:none">← Nazad na pregled</a>
</main>
<script>
// GitHub Pages prikazuje ovaj fajl na bilo kojoj nepostojećoj adresi, pa se početna izračunava:
// projektni sajt (korisnik.github.io/repo/...) → /repo/, sopstveni domen → /
(function(){var p=location.pathname.split('/').filter(Boolean),b='/';if(/\.github\.io$/.test(location.hostname)&&p.length&&(p.length>1||p[0].indexOf('.')<0))b='/'+p[0]+'/';document.getElementById('home').href=b;})();
</script>
</body>
</html>
